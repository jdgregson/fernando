<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Desktop status</title>
    <style>
        :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0d2848; color:#d4d4d4; }
        body { margin:0; padding:24px; }
        main { max-width:900px; margin:5vh auto; }
        h1 { font-size:20px; font-weight:500; }
        p { line-height:1.5; overflow-wrap:anywhere; }
        #phase { color:#aabbcc; font-size:13px; }
        #error { color:#f3a6a6; }
        button { min-height:44px; padding:8px 16px; border:1px solid #657c96; border-radius:5px; background:#263b55; color:inherit; cursor:pointer; }
        button:disabled { cursor:wait; opacity:.6; }
        details { margin-top:20px; }
        summary { cursor:pointer; padding:10px 0; }
        pre { background:#091d34; border:1px solid #334b65; border-radius:5px; padding:12px; max-height:55vh; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; line-height:1.5; }
        @media(max-width:500px) { body { padding:16px; } main { margin:16px auto; } }
    </style>
</head>
<body id="desktopUpdatePage">
    <main>
        <h1 id="heading">Desktop updating</h1>
        <p id="message"></p>
        <p id="phase"></p>
        <p id="error" role="alert"></p>
        <button id="retry" hidden>Retry desktop update</button>
        <details open><summary>Build log</summary><pre id="log"></pre></details>
    </main>
    <script>
        const apiKey = {{ api_key | tojson }};
        const initialStatus = {{ desktop_status | tojson }};
        const retry = document.getElementById('retry');
        const error = document.getElementById('error');
        const log = document.getElementById('log');
        let timer;

        function render(state) {
            if (state.ready) {
                window.location.reload();
                return;
            }
            const failed = ['failed', 'stopped'].includes(state.phase);
            document.getElementById('heading').textContent = state.phase === 'failed' ? 'Desktop update failed' : state.phase === 'stopped' ? 'Desktop stopped' : 'Desktop updating';
            document.getElementById('message').textContent = state.message;
            const elapsed = state.started ? Math.max(0, Math.floor(Date.now() / 1000 - state.started)) : null;
            document.getElementById('phase').textContent = state.phase + (elapsed === null ? '' : ' · ' + Math.floor(elapsed / 60) + 'm ' + elapsed % 60 + 's');
            retry.hidden = !failed;
            const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
            log.textContent = state.log || 'Waiting for desktop update output…';
            if (atBottom) log.scrollTop = log.scrollHeight;
        }

        async function poll() {
            try {
                const response = await fetch('/api/desktop/status', {headers: {'X-API-Key': apiKey}, cache: 'no-store'});
                if (!response.ok) throw new Error(response.status === 401 ? 'Authentication changed. Reload Fernando to reconnect.' : 'Could not read desktop status.');
                error.textContent = '';
                render(await response.json());
            } catch (failure) {
                error.textContent = failure.message;
            } finally {
                timer = setTimeout(poll, 2000);
            }
        }

        retry.onclick = async () => {
            retry.disabled = true;
            try {
                const response = await fetch('/api/desktop/update', {
                    method: 'POST', headers: {'X-API-Key': apiKey, 'Content-Type': 'application/json'}, body: '{}',
                });
                const state = await response.json();
                if (!response.ok) throw new Error(state.error || 'Could not start the desktop update.');
                error.textContent = '';
                render(state);
            } catch (failure) {
                error.textContent = failure.message;
            } finally {
                retry.disabled = false;
            }
        };
        window.addEventListener('pagehide', () => clearTimeout(timer));
        render(initialStatus);
        timer = setTimeout(poll, 1000);
    </script>
</body>
</html>
